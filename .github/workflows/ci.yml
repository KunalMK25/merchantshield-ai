name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic transaction data
        run: python ml/data/generate_synthetic.py

      - name: Build model features
        run: python ml/features/build_features.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run test suite
        run: python -m pytest tests/

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image (includes the seeded demo state)
        run: docker build -t merchantshield-ai .

      - name: Start the container with an analyst token
        run: docker run -d --name ms -p 8000:8000 -e MS_ANALYST_TOKEN=ci-secret merchantshield-ai

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:8000/health && break || sleep 3
          done
          curl -sf localhost:8000/health | grep -q '"model_loaded":true'

      - name: Smoke test
        run: |
          curl -sf localhost:8000/ | grep -qi "<html"
          curl -sf localhost:8000/model/info | grep -q decision_threshold
          curl -sf localhost:8000/registry/runs | grep -q '"run_id"'
          curl -sf localhost:8000/retrain/log | grep -q '"job_id"'
          curl -sf localhost:8000/monitoring/drift/latest | grep -q '"status"'
          curl -sf localhost:8000/cases/summary | grep -q open_alerts
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/cases/alerts/1/dismiss \
                 -H 'content-type: application/json' -d '{"decided_by":"ci"}')
          echo "analyst action without a token: HTTP $code"
          test "$code" = "401"
          echo "memory use of the serving container:"
          docker stats --no-stream --format '{{.MemUsage}}' ms

      - name: The port can be chosen by the host
        run: |
          docker run -d --name ms2 -p 7860:7860 -e PORT=7860 merchantshield-ai
          for i in $(seq 1 60); do curl -sf localhost:7860/health && break || sleep 3; done
          curl -sf localhost:7860/health | grep -q '"model_loaded":true'

      - name: Container logs
        if: always()
        run: docker logs ms | tail -30

